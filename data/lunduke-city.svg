<?xml version="1.0" encoding="UTF-8"?>
<!-- Lunduke City 2 app icon (A3f): slate tile, polished gold frame with a fine
     inner line, and the city skyline as one continuous gold stroke that rises
     from the horizon, runs over every roof, and returns to the horizon. -->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5.6"/>
      <feOffset dy="4.6" result="blur"/>
      <feComponentTransfer in="blur" result="soft">
        <feFuncA type="linear" slope="0.45"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="soft"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="slate" gradientUnits="userSpaceOnUse" x1="0" y1="12" x2="0" y2="244">
      <stop offset="0" stop-color="#202936"/>
      <stop offset="1" stop-color="#121820"/>
    </linearGradient>
    <linearGradient id="frame" gradientUnits="userSpaceOnUse" x1="0" y1="12" x2="0" y2="244">
      <stop offset="0" stop-color="#FFE08A"/>
      <stop offset="0.35" stop-color="#F2C14E"/>
      <stop offset="0.6" stop-color="#8F6A1E"/>
      <stop offset="0.8" stop-color="#F2C14E"/>
      <stop offset="1" stop-color="#FFE08A"/>
    </linearGradient>
    <linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="0" y1="44" x2="0" y2="192">
      <stop offset="0" stop-color="#FFE08A"/>
      <stop offset="0.45" stop-color="#F2C14E"/>
      <stop offset="0.75" stop-color="#C9A646"/>
      <stop offset="1" stop-color="#F2C14E"/>
    </linearGradient>
  </defs>
  <g filter="url(#shadow)">
    <rect x="12" y="12" width="232" height="232" rx="40" fill="url(#slate)" stroke="url(#frame)" stroke-width="5"/>
    <rect x="22" y="22" width="212" height="212" rx="32" fill="none" stroke="#C9A646" stroke-opacity="0.55" stroke-width="1"/>
    <path fill="#161D27" d="M40 192 L40 146 L59 134 L59 122 L62 122 L62 115 L65 115 L65 109 L71 109 L71 115 L74 115 L74 122 L77 122 L77 134 L101 134 L101 80 L106 80 L106 72 L110 72 L110 64 L111.6 64 L114 38 L116.4 64 L118 64 L118 72 L122 72 L122 80 L127 80 L127 108 L131 108 L131 102 L134 102 L134 96 L140 96 L140 102 L143 102 L143 108 L147 108 L147 128 L153 128 L153 122 L165 122 L165 128 L171 128 L171 100 L175 100 L175 94 L178.5 94 L178.5 74 L181.5 74 L181.5 94 L185 94 L185 100 L189 100 L189 142 L216 142 L216 192 Z"/>
