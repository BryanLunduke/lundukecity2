# Cross-build the Windows x86_64 zip on Linux, run the test suite under Wine,
# then start the packaged exe on a real Windows runner.
name: windows

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer commit on the same ref cancels the windows run already in progress.
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cross:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Host packages
        run: |
          sudo dpkg --add-architecture i386
          # ubuntu-24.04 runners try azure.archive.ubuntu.com first
          # (priority 1 in /etc/apt/apt-mirrors.txt) and only then
          # archive.ubuntu.com. A stalled Azure mirror never falls through,
          # and apt ignores SIGTERM, so `timeout` without -k never returns.
          # The last green run on master (00:22Z) used that Azure mirror and
          # finished this step in 41s; later runners sat here past 15 minutes.
          # Prefer the public archive, abort a quiet socket, and SIGKILL a
          # stuck apt. A killed install can leave dpkg half-configured.
          sudo systemctl stop --no-block apt-daily.timer apt-daily-upgrade.timer || true
          sudo systemctl kill --kill-who=all apt-daily.service apt-daily-upgrade.service unattended-upgrades.service || true
          sudo tee /etc/apt/apt.conf.d/99ci-acquire >/dev/null <<'EOF'
          Acquire::http::Timeout "20";
          Acquire::https::Timeout "20";
          Acquire::Retries "3";
          DPkg::Lock::Timeout "30";
          EOF
          sudo tee /etc/apt/apt-mirrors.txt >/dev/null <<'EOF'
          https://archive.ubuntu.com/ubuntu/ priority:1
          https://security.ubuntu.com/ubuntu/ priority:2
          http://azure.archive.ubuntu.com/ubuntu/ priority:3
          EOF
          export DEBIAN_FRONTEND=noninteractive
          n=0
          while [ "$n" -lt 3 ]; do
            n=$((n + 1))
            sudo -E timeout -k 20 60 dpkg --configure -a || true
            if sudo -E timeout -k 20 120 apt-get update \
              && sudo -E timeout -k 30 240 apt-get install -y --no-install-recommends \
                g++-mingw-w64-x86-64-posix gcc-mingw-w64-x86-64-posix binutils-mingw-w64-x86-64 \
                meson ninja-build pkg-config python3 gnupg zstd zip \
                wine wine64 xvfb xauth; then
              exit 0
            fi
            echo "Host packages attempt ${n} did not finish; retrying" >&2
            sleep 5
          done
          exit 1
      - name: Cache MSYS2 packages
        uses: actions/cache@v4
        with:
          path: build-windows/msys2/pkgs
          key: msys2-mingw64-${{ hashFiles('packaging/windows/mingw64-sysroot.py') }}-${{ github.run_id }}
          restore-keys: msys2-mingw64-${{ hashFiles('packaging/windows/mingw64-sysroot.py') }}-
      - name: Build, test under Wine, package
        run: JOBS=4 sh packaging/windows/build-windows.sh build-windows
      - uses: actions/upload-artifact@v4
        with:
          name: lunduke-city-2-windows-x86_64
          path: build-windows/dist/lunduke-city-2-windows-x86_64.zip
          if-no-files-found: error

  windows-smoke:
    needs: cross
    runs-on: windows-2022
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: lunduke-city-2-windows-x86_64
      - name: Headless smoke and UI test on Windows
        shell: pwsh
        run: |
          Expand-Archive lunduke-city-2-windows-x86_64.zip -DestinationPath .
          $exe = "lunduke-city-2\bin\lunduke-city-2.exe"
          foreach ($mode in @("LUNDUKE_CITY2_SMOKE", "LUNDUKE_CITY2_UI_TEST")) {
            $env:SDL_VIDEODRIVER = "dummy"; $env:SDL_AUDIODRIVER = "dummy"
            Set-Item "env:$mode" "1"
            $p = Start-Process -FilePath $exe -PassThru -Wait -NoNewWindow
            Remove-Item "env:$mode"
            if ($p.ExitCode -ne 0) { throw "$mode exited with $($p.ExitCode)" }
          }
